version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: scholarsync-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scholarsync}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # ⚠️ SECURITY: Default password is for LOCAL DEVELOPMENT ONLY
      # In production, ALWAYS set POSTGRES_PASSWORD via environment variable
      # Never commit real passwords to Git
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scholarsync-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scholarsync-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # ⚠️ SECURITY: Uses environment variables - never hardcode real credentials
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/${POSTGRES_DB:-scholarsync}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      # Add other env vars from .env if needed
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/node_modules
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: scholarsync-worker
    environment:
      # ⚠️ SECURITY: Uses environment variables - never hardcode real credentials
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/${POSTGRES_DB:-scholarsync}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-development}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/__pycache__
    command: celery -A apps.worker.celery_app worker --loglevel=info
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local


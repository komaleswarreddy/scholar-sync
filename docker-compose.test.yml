version: '3.8'

# Test environment with isolated services
# Usage: docker-compose -f docker-compose.test.yml up

services:
  postgres-test:
    image: postgres:15
    container_name: scholarsync-postgres-test
    environment:
      POSTGRES_DB: scholarsync_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: scholarsync-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-test:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scholarsync-api-test
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_test@postgres-test:5432/scholarsync_test
      - REDIS_URL=redis://redis-test:6379/0
      - ENVIRONMENT=test
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    profiles:
      - test

volumes:
  postgres_test_data:
    driver: local

